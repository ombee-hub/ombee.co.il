<!--
  ════════════════════════════════════════════════════════════════
  תבנית מייל מעוצב ל-OMBee — להדבקה ב-EmailJS
  ────────────────────────────────────────────────────────────────
  איך משתמשים:
  1. ב-EmailJS Dashboard → Email Templates → צור/י תבנית חדשה.
  2. בעורך התבנית לחצ/י על אייקון הקוד  </>  (Edit Content as HTML).
  3. מחק/י את התוכן הקיים והדבק/י את כל ה-HTML שמתחת לקו הזה.
  4. בשדה "Subject" של התבנית כתב/י:   {{subject}}
  5. בשדה "To Email" כתב/י את הכתובת שלך:   helloombee@gmail.com
  6. בשדה "Reply To" כתב/י:   {{reply_to}}
  7. שמור/י. העתק/י את ה-Template ID ל-contact.html.
  ════════════════════════════════════════════════════════════════
-->
<!-- טעינת הפונט Heebo (נתמך ב-Apple Mail וחלק מהלקוחות; בג'ימייל ובאחרים תהיה נפילה אוטומטית לפונט מערכת נקי) -->
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');
</style>
<div dir="rtl" style="margin:0;padding:0;background:#eef3f6;font-family:'Heebo','Segoe UI','Arial Hebrew',Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef3f6;padding:28px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:92%;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(13,27,42,0.08);">

          <!-- Logo strip -->
          <tr>
            <td align="center" style="background:#ffffff;padding:28px 36px 20px;">
              <!-- הלוגו נטען מכתובת ציבורית. עדכן/י לדומיין שלך אם שונה -->
              <img src="https://ombee.co.il/images/OMBee_Logo.png" alt="OMBee — Graphic Design And UI/UX" width="210" style="display:block;width:210px;max-width:62%;height:auto;margin:0 auto;border:0;"/>
            </td>
          </tr>

          <!-- Title band -->
          <tr>
            <td style="background:#00B3DD;background:linear-gradient(135deg,#00B3DD,#0086A8);padding:26px 36px;text-align:center;">
              <div style="font-size:26px;font-weight:900;color:#ffffff;letter-spacing:-.02em;">פנייה חדשה מהאתר ✉️</div>
              <div style="margin-top:6px;font-size:14px;color:rgba(255,255,255,.9);">מישהו השאיר פרטים בטופס יצירת הקשר</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px 36px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:separate;">

                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;width:130px;vertical-align:top;">שם מלא</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;font-weight:700;color:#0D1B2A;">{{name}}</td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;vertical-align:top;">אימייל</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;color:#0D1B2A;"><a href="mailto:{{email}}" style="color:#00B3DD;font-weight:700;text-decoration:none;">{{email}}</a></td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;vertical-align:top;">טלפון</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;color:#0D1B2A;"><a href="tel:{{phone}}" style="color:#00B3DD;font-weight:700;text-decoration:none;">{{phone}}</a></td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;vertical-align:top;">שם העסק</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;color:#0D1B2A;">{{company}}</td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;vertical-align:top;">ח.פ / ע.מ</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;color:#0D1B2A;">{{company_id}}</td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:13px;font-weight:700;color:#AECDD7;vertical-align:top;">סוג שירות</td>
                  <td style="padding:12px 0;border-bottom:1px solid #eef3f6;font-size:15px;color:#0D1B2A;"><span style="display:inline-block;background:rgba(0,179,221,.1);color:#0086A8;font-weight:700;font-size:13px;padding:5px 14px;border-radius:50px;">{{service}}</span></td>
                </tr>
              </table>

              <!-- Message -->
              <div style="margin-top:22px;font-size:13px;font-weight:700;color:#AECDD7;">תיאור הפרויקט</div>
              <div style="margin-top:8px;padding:18px 20px;background:#F2FBFD;border-right:4px solid #00B3DD;border-radius:10px;font-size:15px;line-height:1.8;color:#0D1B2A;white-space:pre-line;">{{message}}</div>

              <!-- CTA -->
              <div style="text-align:center;margin:28px 0 8px;">
                <a href="mailto:{{email}}" style="display:inline-block;background:#00B3DD;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:13px 34px;border-radius:8px;">השב/י לפנייה</a>
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#0D1B2A;padding:22px 36px;text-align:center;">
              <div style="font-size:13px;color:rgba(255,255,255,.7);">התקבל בתאריך {{time}}</div>
              <div style="margin-top:6px;font-size:12px;color:rgba(255,255,255,.45);">נשלח אוטומטית מטופס יצירת הקשר באתר OMBee</div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
