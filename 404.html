<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OMBee - הדף לא נמצא</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="images/icon-ombee-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#fff;color:#00164D;direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.wrap{max-width:520px}
.logo{height:44px;width:auto;margin:0 auto 36px}
h1{font-size:clamp(64px,14vw,120px);font-weight:900;line-height:1;background:linear-gradient(135deg,#015CFD,#0021A3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-size:clamp(20px,4vw,28px);font-weight:700;margin:10px 0 14px}
p{color:#6B7280;margin-bottom:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:8px;font-size:15px;font-weight:700;background:#015CFD;color:#fff;text-decoration:none;transition:all .3s}
.btn:hover{background:#009AFE;transform:translateY(-3px);box-shadow:0 16px 40px rgba(1,92,253,.3)}
</style>
</head>
<body>
<div class="wrap">
 <img src="images/ombee-logo.png" alt="OMBee Studio" class="logo"/>
 <h1>404</h1>
 <h2>אופס, הדף הזה לא קיים</h2>
 <p>יכול להיות שהקישור השתנה או שהדף הוסר. בואו נחזור למקום בטוח.</p>
 <a href="/" class="btn">חזרה לדף הבית</a>
</div>
</body>
</html>
